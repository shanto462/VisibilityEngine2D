[workspace]
resolver = "3"
members = ["crates/visibility-core", "crates/visibility-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/shanto462/VisibilityEngine2D"
readme = "README.md"

[workspace.dependencies]
visibility-core = { path = "crates/visibility-core", version = "1.0.0" }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds responsive: optimize dependencies (egui, wgpu) even in dev.
[profile.dev.package."*"]
opt-level = 2
