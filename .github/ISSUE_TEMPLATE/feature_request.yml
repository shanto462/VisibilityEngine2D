name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: For example, "I want to test visibility against my own level geometry, not random obstacles."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? A sample command or API call helps.
      placeholder: For example, "visibility-engine-2d --scene level.json"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      placeholder: For example, "Calling the library from my own tool, but then I lose the viewer."
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or sample files.
